name: Set up the Project

# Creates or repairs the fields and views on the organization Project, with the GitHub App's token. Run by hand.
# The key lives in the github-app environment, which only main can deploy to; `projecthub app create` puts it there.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    environment: github-app
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PROJECTHUB_APP_ID }}
          private-key: ${{ secrets.PROJECTHUB_APP_PRIVATE_KEY }}
          owner: b1tninja-labs
      - run: python -m pip install --quiet "git+https://github.com/b1tninja-labs/projecthub@19df3fe4117d1fcb1467ab80d52c91c13d0c261e"
      - run: projecthub board --schema-only --apply
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
