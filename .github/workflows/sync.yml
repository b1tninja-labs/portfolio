name: Sync the portfolio

# Reads every product repository's ROADMAP and brings this repository's issues and Project 1 up to date, so a
# change pushed to a product shows here without anyone running a sync. The product repositories need no
# secrets: they are cloned read-only, and only this workflow writes, with the GitHub App's token.
#
# The schedule stays off until every issue has moved into this repository. A run before that would not see
# the issues still in their old repositories and would file duplicates of them here.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: portfolio-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: github-app
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PROJECTHUB_APP_ID }}
          private-key: ${{ secrets.PROJECTHUB_APP_PRIVATE_KEY }}
          owner: b1tninja-labs
      - run: python -m pip install --quiet "git+https://github.com/b1tninja-labs/projecthub@ba90c4ea99950b3b3be239a2a618899232d5e306"
      - name: Check out the product repositories
        run: projecthub checkout --dest "$RUNNER_TEMP/workspace"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
      - name: Issues from each ROADMAP
        run: projecthub sync --apply --root "$RUNNER_TEMP/workspace"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
      - name: Project 1 from each project
        run: projecthub board --all-projects --apply
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          FORGE_ROOT: ${{ runner.temp }}/workspace
