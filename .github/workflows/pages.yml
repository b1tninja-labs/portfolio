name: Pages

# Builds the status site and publishes it with GitHub Pages. For now the data is
# the committed snapshot in data/; a later step reads it from the org Project.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Built for the root path: visitors reach it at labs.b1tninja.com through CloudFront, whose origin is
      # this site's /portfolio path. Links on the raw github.io address will not resolve.
      - name: Build
        run: python3 tools/build_site.py --out _site --base / --version "${GITHUB_SHA::7}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
