name: Pages

# Builds the status site and publishes it with GitHub Pages. The data is built on every run by
# `projecthub site` from Project 1 alone: one paginated GraphQL read, no checkout of any product repository.
# If that step fails, or would spend more than its point budget, the deploy does not run and the last good
# site stays up.
#
# What starts a run:
# - projecthub's drain sends `projecthub-state-changed` when the Project changes, at most once every 10 minutes.
#   repository_dispatch only runs this file as it is on the default branch, so the trigger takes effect once
#   this is merged. client_payload is not read: the build reads the Project itself.
# - The hourly schedule is the fallback for a dispatch that never arrives. It runs at :17, away from the top
#   of the hour, when GitHub delays scheduled runs most.
# - A push to main, a finished "Sync the portfolio" run, or a person (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [projecthub-state-changed]
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows: ["Sync the portfolio"]
    types: [completed]

permissions:
  contents: read

# The newest state wins: a run that starts while another is building cancels it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The App's token reads Project 1, which is private for now. Only main can use this environment.
    environment: github-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PROJECTHUB_APP_ID }}
          private-key: ${{ secrets.PROJECTHUB_APP_PRIVATE_KEY }}
          owner: b1tninja-labs
      # Pinned to projecthub main after #8, #9 and #10, so a projecthub change cannot move the site without a
      # commit here.
      - run: python -m pip install --quiet "git+https://github.com/b1tninja-labs/projecthub@9b5064982f5e32a9faff964eb63ea93560c6d0d3"
      - name: Data from Project 1
        run: projecthub site --out data --active 6 --budget 100
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
      # Built for the root path: visitors reach it at labs.b1tninja.com through CloudFront, whose origin is
      # this site's /portfolio path. Links on the raw github.io address will not resolve.
      - name: Build
        run: python3 tools/build_site.py --out _site --base / --version "${GITHUB_SHA::7}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
