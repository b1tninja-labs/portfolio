name: Pages

# Builds the status site and publishes it with GitHub Pages. The data is built live on every run by
# `projecthub site`, from the product repositories and Project 1, so the site follows the Project without a
# commit. If that step fails the deploy does not run, and the last good site stays up.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15,45 * * * *"
  workflow_run:
    workflows: ["Sync the portfolio"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The App's token reads Project 1, which is private for now. Only main can use this environment.
    environment: github-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PROJECTHUB_APP_ID }}
          private-key: ${{ secrets.PROJECTHUB_APP_PRIVATE_KEY }}
          owner: b1tninja-labs
      - run: python -m pip install --quiet "git+https://github.com/b1tninja-labs/projecthub@3c468679c3dd93d4c6f9a83c7f8a0669a9d9db31"
      - name: Check out the product repositories
        run: projecthub checkout --dest "$RUNNER_TEMP/workspace"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
      - name: Live data from the products and Project 1
        run: projecthub site --out data
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          FORGE_ROOT: ${{ runner.temp }}/workspace
      # Built for the root path: visitors reach it at labs.b1tninja.com through CloudFront, whose origin is
      # this site's /portfolio path. Links on the raw github.io address will not resolve.
      - name: Build
        run: python3 tools/build_site.py --out _site --base / --version "${GITHUB_SHA::7}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
