<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project · b1tninja</title>
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230f766e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="site.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="./">b1tninja</a>
    <nav class="toplinks" aria-label="Elsewhere">
      <a href="https://github.com/b1tninja">GitHub</a>
      <a href="https://github.com/users/b1tninja/projects/4">Roadmap</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="crumbs"><a href="./">Projects</a> / <span id="crumb"></span></div>
  <div class="phead">
    <div id="badges" class="card-top" style="justify-content:flex-start;gap:1rem"></div>
    <h1 id="title">Loading</h1>
    <p class="lede" id="what"></p>
    <div class="actions" id="actions"></div>
  </div>
  <div class="layout" id="project">
    <noscript><p class="empty">This page needs JavaScript. All repositories are on <a href="https://github.com/b1tninja">GitHub</a>.</p></noscript>
  </div>
</main>

<footer class="site"><div class="wrap"><span id="updated"></span><a href="./">All projects</a></div></footer>

<script src="site.js"></script>
<script>
"use strict";
// Copied to p/<name>/index.html by tools/build_site.py; reads data/p/<name>.json.

function facts(p) {
  const dl = el("dl", { class: "facts" });
  const row = (k, v) => { if (v != null && v !== "") dl.append(el("dt", {}, k), el("dd", {}, v)); };
  row("Status", statusBadge(p.status));
  row("Kind", p.kind);
  if (p.tier != null) row("Tier · wave", `${p.tier} · ${p.wave}`);
  row("Progress", progressText(p.progress));
  if (p.blocked_by && p.blocked_by.length) {
    const dd = el("span");
    p.blocked_by.forEach((n, i) => { if (i) dd.append(", "); dd.append(projectLink(n)); });
    row("Needs", dd);
  }
  row("Language", langLabel(p.language));
  if (p.upstream) row("Fork of", p.upstream);
  row("Last push", ago(p.last_push));
  return el("aside", {}, el("div", { class: "panel" }, dl, progressRow(p.progress)));
}

// obligations: [{ id, title, spec, state, test, blocked_by }]
function obligations(rows) {
  if (!Array.isArray(rows) || !rows.length) return null;
  const tbody = el("tbody");
  for (const o of rows) {
    tbody.append(el("tr", {},
      el("td", { class: "id" }, o.id || ""),
      el("td", {}, o.title || ""),
      el("td", { class: "spec" }, o.spec || ""),
      el("td", { class: "state" }, stateBadge(o.state)),
      el("td", { class: "test" }, o.test || "")));
  }
  return el("section", { id: "obligations" }, el("h2", {}, "Obligations"),
    el("div", { class: "table-wrap" }, el("table", {},
      el("thead", {}, el("tr", {}, ...["ID", "Obligation", "Spec", "State", "Named test"].map((h) => el("th", { scope: "col" }, h)))),
      tbody)));
}

// activity: [{ at, actor, kind, text }], newest first
function activity(items) {
  if (!Array.isArray(items) || !items.length) return null;
  return el("section", { id: "activity" }, el("h2", {}, "Recent activity"),
    el("ol", { class: "activity" }, ...items.slice(0, 50).map((a) =>
      el("li", {}, el("time", { datetime: a.at || null }, stamp(a.at)), a.text || a.kind || ""))));
}

function install(entry) {
  if (!entry || !Array.isArray(entry.snippets) || !entry.snippets.length) return null;
  return el("section", { id: "install" }, el("h2", {}, "Install"),
    entry.requires ? el("p", { class: "install-req" }, "Needs " + entry.requires + ".") : null,
    ...entry.snippets.map(snippet));
}

function render(doc, installs) {
  const p = doc.project;
  const title = p.display_name || p.name;
  document.title = `${title} · b1tninja`;
  document.getElementById("crumb").textContent = title;
  document.getElementById("title").textContent = title;
  document.getElementById("what").textContent = p.what || "";
  document.getElementById("badges").replaceChildren(kindLabel(p.kind), statusBadge(p.status));
  const actions = document.getElementById("actions");
  actions.replaceChildren();
  if (p.repo_url) actions.append(link(p.repo_url, "View on GitHub", { class: "btn primary" }));
  if (p.roadmap_url) actions.append(link(p.roadmap_url, "Roadmap", { class: "btn" }));
  if (p.homepage_url) actions.append(link(p.homepage_url, "Website", { class: "btn" }));

  const main = el("div");
  const how = install((installs || {})[p.name]);
  if (how) main.append(how);
  const parts = [obligations(doc.obligations), activity(doc.activity)].filter(Boolean);
  if (parts.length) main.append(...parts);
  else if (!how) main.append(el("p", { class: "note" }, "Obligations and activity appear here once this project is tracked by the portfolio coordinator."));
  document.getElementById("project").replaceChildren(main, facts(p));
  document.getElementById("updated").textContent = `Updated ${stamp(doc.generated_at)}.`;
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
}

const name = decodeURIComponent((location.pathname.match(/\/p\/([^/]+)\/?$/) || [, ""])[1]);
const root = document.getElementById("project");
document.getElementById("crumb").textContent = NAME_RE.test(name) ? name : "";
if (!NAME_RE.test(name)) loadFailed(root, "This project");
else Promise.all([getJSON(`data/p/${name}.json`), getInstall()]).then(([doc, installs]) => render(doc, installs)).catch(() => { document.getElementById("title").textContent = name; loadFailed(root, "This project"); });
</script>
</body>
</html>
